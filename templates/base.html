<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}کلینیک روانشناسی دکتر شفایی{% endblock %}</title>
    
    <!-- فونت زیبای وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- بوت‌استرپ و آیکون‌های استاندارد -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-green: #4A7C59;
            --light-green: #E9F2EA;
            --cream-bg: #FCFBF4;
            --text-dark: #333333;
            --text-muted: #6c757d;
        }
        
        body { 
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif; 
            background-color: var(--cream-bg); 
            color: var(--text-dark);
            line-height: 1.8;
        }
        
        /* تنظیمات منوی بالای سایت */
        .navbar { 
            background-color: #ffffff;
            box-shadow: 0 2px 15px rgba(0,0,0,0.03);
            border-bottom: 2px solid var(--light-green);
        }
        .navbar-brand { 
            color: var(--primary-green) !important; 
            font-weight: 800;
            font-size: 1.4rem;
        }
        .nav-link { 
            color: var(--text-dark) !important; 
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: var(--primary-green) !important;
        }
        
        /* تنظیمات عمومی کارت‌ها و دکمه‌ها */
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            transition: transform 0.3s ease;
        }
        .btn-primary {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            border-radius: 8px;
            padding: 10px 25px;
        }
        .btn-primary:hover {
            background-color: #3b6347;
            border-color: #3b6347;
        }
        
        /* فوکوس روی فیلدهای فرم */
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.25rem rgba(74, 124, 89, 0.2);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 py-3">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-flower1 me-2"></i>کلینیک دکتر شفایی</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-1 text-dark"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i> صفحه اصلی</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about"><i class="bi bi-person me-1"></i> درباره ما</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/booking"><i class="bi bi-calendar-check me-1"></i> رزرو نوبت</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center py-4 border-top" style="background-color: #ffffff;">
        <p class="text-muted mb-0 small">تمامی حقوق برای کلینیک روانشناسی دکتر شفایی محفوظ است. © ۱۴۰۵</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
