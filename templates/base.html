<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}کلینیک روانشناسی دکتر شفایی{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { 
            font-family: Tahoma, Arial, sans-serif; 
            background-color: #f8f9fa; 
        }
        .navbar { 
            background-color: #2c3e50; /* رنگ سرمه‌ای ملایم برای منو */
        }
        .navbar-brand, .nav-link { 
            color: #ffffff !important; 
        }
        .nav-link:hover {
            color: #1abc9c !important; /* رنگ سبزآبی هنگام رفتن موس روی منوها */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🩺 کلینیک دکتر شفایی</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="background-color: white;">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">🏠 صفحه اصلی</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">👤 درباره ما</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articles">📚 مطالب مفید</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/booking">📅 رزرو نوبت</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 py-4 text-muted">
        <p>تمامی حقوق برای کلینیک روانشناسی دکتر شفایی محفوظ است. © ۱۴۰۵</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
